<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="topo">
      <div>
        <h1>Cadastro de Alunos</h1>
        <p class="subtitulo">Cursos e alunos: um curso tem vários alunos (1:N). A lista carrega ao rolar a tela.</p>
      </div>
      <button id="btn-novo" class="btn btn-primario">+ Novo aluno</button>
    </div>

    <div id="msg" class="msg" hidden></div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Cursos</h2>
        <form id="form-curso" class="form-linha">
          <input type="text" id="novo-curso" placeholder="Nome do novo curso" required>
          <button type="submit" class="btn btn-primario">Adicionar curso</button>
        </form>
      </div>
      <table>
        <thead>
          <tr>
            <th>Curso</th>
            <th>Alunos</th>
            <th class="acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-cursos">
          <tr><td colspan="3" class="vazio">Carregando cursos...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="painel">
      <div class="painel-cabecalho">
        <h2>Alunos cadastrados</h2>
        <div class="filtros">
          <select id="filtro-curso">
            <option value="">Todos os cursos</option>
          </select>
          <button id="btn-atualizar" class="btn btn-secundario">Atualizar lista</button>
        </div>
      </div>
      <form id="form-busca" class="busca-linha">
        <input id="busca-aluno" type="search" placeholder="Pesquisar por nome ou RA" />
        <button type="submit" class="btn btn-primario">Pesquisar</button>
      </form>
      <div id="criterio-pesquisa" class="criterio-pesquisa" hidden></div>
  
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>RA</th>
            <th>Curso</th>
            <th class="acoes">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-alunos">
          <tr><td colspan="4" class="vazio">Carregando...</td></tr>
        </tbody>
      </table>
      <p id="alunos-status" class="rolagem-status">Carregando...</p>
      <div id="sentinela-alunos" aria-hidden="true"></div>
    </div>
  </div>
  <div id="modal" class="modal" hidden>
    <div id="modal-fundo" class="modal-fundo"></div>
    <div class="modal-caixa">
      <h2 id="modal-titulo">Novo aluno</h2>
      <form id="form-aluno">
        <label>Nome <input type="text" id="nome" required></label>
        <label>RA <input type="text" id="ra" required></label>
        <label>Curso 
          <input type="text" id="curso" list="lista-cursos" required autocomplete="off" placeholder="Digite o curso">
          <datalist id="lista-cursos"></datalist>
        </label>
        <div class="modal-acoes">
          <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
          <button type="submit" class="btn btn-primario">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
